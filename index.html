<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Life Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Particle Life (Artificial Life)</h1>
        <div class="controls">
            <button id="toggleBtn">Pause</button>
            <button id="randomizeRulesBtn">Randomize Laws of Physics 🌌</button>
            <button id="resetParticlesBtn">Reset Particles</button>
        </div>
        <div class="sliders">
            <label>Friction: <input type="range" id="frictionSlider" min="1" max="99" value="50"></label>
            <label>Interaction Radius: <input type="range" id="radiusSlider" min="10" max="200" value="80"></label>
            <label><input type="checkbox" id="trailsCheckbox" checked> Show Trails</label>
        </div>
        <div class="canvas-container">
            <canvas id="simCanvas" width="800" height="600"></canvas>
            <div id="fpsCounter">FPS: 0</div>
        </div>
        <p class="instructions">Click "Randomize Laws of Physics" to discover new emergent behaviors (organisms, crystals, swarms).</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
