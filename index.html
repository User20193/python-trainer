<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniVille (Utility AI Life Sim)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">

        <div class="main-panel">
            <div class="header">
                <h1>MiniVille</h1>
                <div class="time-display">
                    Day <span id="dayCount">1</span> | <span id="clockTime">08:00</span>
                </div>
                <div class="controls">
                    <button id="toggleBtn">Pause</button>
                    <button id="speedBtn">Fast Forward ⏩</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="simCanvas" width="800" height="600"></canvas>
            </div>
            <p class="hint">Click on any character to inspect their thoughts, needs, and memory.</p>
        </div>

        <div class="dashboard">
            <h2>Inspector</h2>
            <div class="inspector" id="inspectorPanel">
                <p class="inspector-hint">Select a character...</p>
                <div class="inspector-data" style="display: none;">
                    <h3 id="insName">Name</h3>
                    <p class="status">💭 "<span id="insAction">Sleeping</span>"</p>

                    <hr>
                    <h4>Needs</h4>
                    <div class="need-bar-container">
                        <label>Energy (Sleep)</label>
                        <div class="bar-bg"><div class="bar-fill blue-bar" id="barEnergy"></div></div>
                    </div>
                    <div class="need-bar-container">
                        <label>Hunger (Food)</label>
                        <div class="bar-bg"><div class="bar-fill green-bar" id="barHunger"></div></div>
                    </div>
                    <div class="need-bar-container">
                        <label>Social (Chat)</label>
                        <div class="bar-bg"><div class="bar-fill orange-bar" id="barSocial"></div></div>
                    </div>
                    <div class="need-bar-container">
                        <label>Money</label>
                        <div style="color: gold; font-weight: bold;">$<span id="insMoney">0</span></div>
                    </div>

                    <hr>
                    <h4>Memory / Logs</h4>
                    <ul class="memory-log" id="memoryLog">
                        <!-- Filled by JS -->
                    </ul>
                </div>
            </div>

            <h2>Legend</h2>
            <ul class="legend">
                <li><span class="color-box" style="background: #3b82f6;"></span> House (Sleep)</li>
                <li><span class="color-box" style="background: #8b5cf6;"></span> Office (Work)</li>
                <li><span class="color-box" style="background: #ef4444;"></span> Cafe (Eat)</li>
                <li><span class="color-box" style="background: #22c55e;"></span> Park (Socialize)</li>
            </ul>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
