<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Evolution</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Evolution of Intelligence</h1>
        <p class="description">Watch creatures evolve to find food (green) and avoid poison (red) using genetic algorithms.</p>

        <div class="controls">
            <button id="toggleBtn">Pause</button>
            <button id="resetBtn">Extinction (Reset)</button>
            <label><input type="checkbox" id="debugCheckbox"> Show Perception Radii</label>
        </div>

        <div class="stats">
            <span>Population: <span id="popCount">0</span></span>
            <span>Food: <span id="foodCount">0</span></span>
            <span>Poison: <span id="poisonCount">0</span></span>
            <span>Highest Age: <span id="maxAge">0</span></span>
        </div>

        <div class="canvas-container">
            <canvas id="simCanvas" width="800" height="600"></canvas>
            <div id="fpsCounter">FPS: 0</div>
        </div>

        <p class="instructions">You can click on the canvas to manually spawn food.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
