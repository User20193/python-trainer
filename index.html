<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МиниГрад (Симуляция жизни ИИ)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">

        <div class="main-panel">
            <div class="header">
                <h1>МиниГрад</h1>
                <div class="time-display">
                    День <span id="dayCount">1</span> | <span id="clockTime">08:00</span>
                </div>
                <div class="controls">
                    <button id="toggleBtn">Пауза</button>
                    <button id="speedBtn">Ускорение ⏩</button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="simCanvas" width="800" height="600"></canvas>
            </div>
            <p class="hint">Нажмите на любого персонажа, чтобы увидеть его мысли, потребности и память.</p>
        </div>

        <div class="dashboard">
            <h2>Инспектор</h2>
            <div class="inspector" id="inspectorPanel">
                <p class="inspector-hint">Выберите персонажа...</p>
                <div class="inspector-data" style="display: none;">
                    <h3 id="insName">Имя</h3>
                    <p class="status">💭 "<span id="insAction">Sleeping</span>"</p>

                    <hr>
                    <h4>Потребности</h4>
                    <div class="need-bar-container">
                        <label>Энергия (Сон)</label>
                        <div class="bar-bg"><div class="bar-fill blue-bar" id="barEnergy"></div></div>
                    </div>
                    <div class="need-bar-container">
                        <label>Голод (Еда)</label>
                        <div class="bar-bg"><div class="bar-fill green-bar" id="barHunger"></div></div>
                    </div>
                    <div class="need-bar-container">
                        <label>Общение (Разговор)</label>
                        <div class="bar-bg"><div class="bar-fill orange-bar" id="barSocial"></div></div>
                    </div>
                    <div class="need-bar-container">
                        <label>Деньги</label>
                        <div style="color: gold; font-weight: bold;">$<span id="insMoney">0</span></div>
                    </div>

                    <hr>
                    <h4>Память / Логи</h4>
                    <ul class="memory-log" id="memoryLog">
                        <!-- Filled by JS -->
                    </ul>
                </div>
            </div>

            <h2>Легенда</h2>
            <ul class="legend">
                <li><span class="color-box" style="background: #3b82f6;"></span> Дом (Сон)</li>
                <li><span class="color-box" style="background: #8b5cf6;"></span> Офис (Работа)</li>
                <li><span class="color-box" style="background: #ef4444;"></span> Кафе (Еда)</li>
                <li><span class="color-box" style="background: #22c55e;"></span> Парк (Общение)</li>
            </ul>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
